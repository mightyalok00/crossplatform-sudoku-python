[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-flow"
version = "1.0.0"
description = "A modern, cross-platform Sudoku game built with Python and Flet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet>=1.0.3"]

[project.scripts]
sudoku-flow = "sudoku_flow.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
