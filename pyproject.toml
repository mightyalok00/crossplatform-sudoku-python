[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-flow"
version = "1.0.0"
description = "A modern, cross-platform Sudoku game built with Python and Flet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet>=1.0.3"]

[project.scripts]
sudoku-flow = "sudoku_flow.app:run"

[tool.flet]
product = "Sudoku Flow"
artifact = "sudoku-flow"

[tool.flet.app]
module = "main"
exclude = ["tests"]

[tool.flet.web]
renderer = "canvaskit"
route_url_strategy = "hash"
pwa_background_color = "#0B0F19"
pwa_theme_color = "#38BDF8"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
