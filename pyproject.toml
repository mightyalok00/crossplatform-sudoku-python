[project]
name = "sudoku-game"
version = "1.0.0"
description = "A dark-themed Sudoku game with difficulty levels, hints, a timer, and saved progress."
requires-python = ">=3.12"
authors = [
    { name = "Alok Agarwal", email = "mightyalok00@gmail.com" }
]
dependencies = [
    "flet"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "Sudoku"

[tool.flet]
org = "dev.flet"
company = "Alok Agarwal"
copyright = "Copyright (C) 2026 by Alok Agarwal"
icon_background = "#263238"

[tool.flet.splash]
color = "#263238"
dark_color = "#263238"

[tool.flet.app]
path = "src"
